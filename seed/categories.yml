# categories.yml
categories:
  - id: "shimama-cat-001-entradas"
    name: "Entradas"
    description: "Starters and appetizers"
    color: "from-orange-400 to-red-500"
    icon: "bread-slice"
    display_order: 1
    is_active: true

  - id: "shimama-cat-002-ementa"
    name: "Ementa"
    description: "Main kebab dishes and plates"
    color: "from-red-500 to-orange-600"
    icon: "drumstick-bite"
    display_order: 2
    is_active: true

  - id: "shimama-cat-003-bebidas"
    name: "Bebidas"
    description: "Soft drinks and water"
    color: "from-blue-400 to-blue-600"
    icon: "wine-bottle"
    display_order: 3
    is_active: true

  - id: "shimama-cat-004-extras"
    name: "Extras"
    description: "Sauces, extra portions and sides"
    color: "from-yellow-400 to-orange-500"
    icon: "plus-circle"
    display_order: 4
    is_active: true

  - id: "shimama-cat-005-fast"
    name: "Shimama Fast"
    description: "Quick bites and snacks"
    color: "from-purple-500 to-indigo-600"
    icon: "bolt"
    display_order: 5
    is_active: true

  - id: "shimama-cat-006-veggie"
    name: "Veggie"
    description: "Vegetarian falafel options"
    color: "from-green-500 to-emerald-600"
    icon: "leaf"
    display_order: 6
    is_active: true

  - id: "shimama-cat-007-small"
    name: "Small Shi's"
    description: "Smaller portions and kids menus"
    color: "from-pink-400 to-rose-500"
    icon: "child"
    display_order: 7
    is_active: true

  - id: "shimama-cat-008-tacos"
    name: "Tacos (Nossas Sugestões)"
    description: "Specialty French Tacos"
    color: "from-amber-500 to-yellow-600"
    icon: "hamburger"
    display_order: 8
    is_active: true