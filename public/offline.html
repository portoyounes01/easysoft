<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — EasySoft</title>
  <style>
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, sans-serif; background:#f7f7f7; color:#111; }
    .card { text-align:center; max-width:340px; padding:32px; }
    .bolt { width:64px; height:64px; border-radius:16px; background:#059669; display:inline-flex;
      align-items:center; justify-content:center; margin-bottom:20px; }
    h1 { font-size:20px; margin:0 0 8px; } p { color:#555; line-height:1.5; margin:0 0 20px; }
    button { background:#059669; color:#fff; border:0; border-radius:10px; padding:12px 20px;
      font-size:15px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bolt"><svg width="32" height="32" viewBox="0 0 24 24"><polygon points="13 3 5 13 11 13 10 21 18 11 12 11 13 3" fill="#fff"/></svg></div>
    <h1>You're offline</h1>
    <p>EasySoft needs a connection to work. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
